[package]
name = "codex-claude-mode"
version = "0.4.8"
edition = "2024"
license = "Apache-2.0"
description = "A standalone multi-agent workspace for Codex"
repository = "https://github.com/korkin25/codex-claude-mode"
readme = "README.md"
rust-version = "1.95"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.28"
ratatui = "0.29"
serde_json = "1"
textwrap = "0.16"

[dev-dependencies]
pretty_assertions = "1"
