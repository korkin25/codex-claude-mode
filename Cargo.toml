[package]
name = "codex-claude-mode"
version = "0.3.1"
edition = "2024"
license = "Apache-2.0"
description = "A standalone multi-agent workspace and remote control plane for Codex"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.28"
ratatui = "0.29"
serde_json = "1"
textwrap = "0.16"

[dev-dependencies]
pretty_assertions = "1"
